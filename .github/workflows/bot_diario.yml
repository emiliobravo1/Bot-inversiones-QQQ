name: Bot Finanzas QQQ

on:
  schedule:
    # 15:30 en UTC corresponde a las 11:30 AM en Chile (UTC-4 en invierno)
    # 1-5 significa de lunes a viernes
    - cron: '30 15 * * 1-5'
  workflow_dispatch: # Esto te permite ejecutarlo manualmente con el botón "Run workflow"

jobs:
  ejecutar-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Clonar el código del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar librerías
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas vaderSentiment requests python-dotenv
          # Si tienes un archivo requirements.txt, borra la línea de arriba y usa esta:
          # pip install -r requirements.txt

      - name: Ejecutar el script del bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python bot.py