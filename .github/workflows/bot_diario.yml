name: Bot Finanzas Diario

on:
  schedule:
    # Se ejecuta a las 15:30 UTC (11:30 AM hora Chile) de lunes a viernes
    - cron: '30 15 * * 1-5'
  workflow_dispatch:

jobs:
  ejecutar-bot:
    runs-on: ubuntu-latest # El servidor gratuito de GitHub

    steps:
    - name: Clonar el repositorio
      uses: actions/checkout@v4

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Instalar dependencias
      run: |
        python -m pip install --upgrade pip
        pip install yfinance pandas requests python-dotenv

    - name: Ejecutar script de finanzas
      env:
        # Aquí conectamos los secretos de GitHub con tu código
        TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: python bot.py